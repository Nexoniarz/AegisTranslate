name: Feature request
description: Suggest an idea or a model
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could AegisTranslate help?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This works without sending page content to any server.
